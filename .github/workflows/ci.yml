name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: vltpkg/setup-vlt@v1

      # Retry once: installs with an empty cache have failed with connect
      # ETIMEDOUT and passed on a rerun that reuses the partial cache.
      - name: Install dependencies
        run: vlt ci || vlt ci

      - name: Lint and test
        run: vlr test
